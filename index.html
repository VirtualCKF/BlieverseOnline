<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Unity WebGL Player | Blieverse Online</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/icon200.png">
    <link rel="icon" type="image/png" sizes="200x200" href="TemplateData/icon200.png">
    <style>
      /* �j���мg Unity �b����ݥͦ�����Ϳ�J�w���ئ�m */
      input[type="text"], input[type="password"], textarea {
        position: fixed !important;
        bottom: auto !important;     /* �����쥻�K�b�������]�w */
        top: 50% !important;         /* ����e�����W�q�]�׶}���������L�A40% �� 50% ��w���^ */
        left: 50% !important;        /* ����e���������� */
        transform: translate(-50%, -50%) !important; /* ��Ǹm����� */
        
        /* �˦��P���Y���u�� */
        width: 85% !important;       /* �e�צ��ù��� 85% */
        max-width: 600px !important; 
        z-index: 999999 !important;  /* �T�O����\�b Unity �e���̤W�h */
        font-size: 16px !important;  /* ����GiOS �W�w�j�󵥩� 16px �I���~���|����Ӻ����e����M��j��j */
        
        /* ��ı�L�ա]�i�ۥѽվ�^ */
        padding: 12px !important;
        background-color: #ffffff !important;
        color: #000000 !important;
        border: 2px solid #2196F3 !important; /* �����@���Ŧ���ءA�T�{���b�� */
        border-radius: 8px !important;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3) !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // --- �i���֨����� 2�j�۰���� Unity �� Version �������ê`�J URL �Ѽ� ---
      var unityVersion = "0.45";
      var buildUrl = "Build";
      
      // �۰ʦb Loader �����[�W�������]�p .js?v="0.2"�^
      var loaderUrl = buildUrl + "/VirturalExhibition_Online.loader.js?v=" + encodeURIComponent(unityVersion);
      var config = {
        // �۰ʦb�Ҧ��֤߸귽�ɮ׫��[�W ?v=����
        dataUrl: buildUrl + "/VirturalExhibition_Online.data.unityweb?v=" + encodeURIComponent(unityVersion),
        frameworkUrl: buildUrl + "/VirturalExhibition_Online.framework.js.unityweb?v=" + encodeURIComponent(unityVersion),
        codeUrl: buildUrl + "/VirturalExhibition_Online.wasm.unityweb?v=" + encodeURIComponent(unityVersion),
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Blieverse Online",
        productVersion: "0.45",
        showBanner: unityShowBanner,
      };

      // --- 【核心 WebGL Post-Processing 流暢度優化】 ---
// 偵測是否為行動裝置（包含防範現代 iPad 偽裝成 Mac 的檢測）
var isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || 
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// 限制高階手機（如 iPhone Retina 螢幕）超高解析度渲染，防止 GPU 過熱發燙，解決 10 秒後降頻卡頓
//config.devicePixelRatio = Math.min(window.devicePixelRatio, 0.5); 
// 1. 先計算出我們要的 targetPixelRatio
var targetPixelRatio = Math.min(window.devicePixelRatio || 0.5, 1);
      // 2. 針對舊版 Android 平板或不支援動態 DPR 的設備，直接強制重設畫布的實體畫素
if (/Android/i.test(navigator.userAgent)) {
    // 取得瀏覽器當前的實際視窗寬高
    var displayWidth = window.innerWidth;
    var displayHeight = window.innerHeight;
    
    // 強制將 Canvas 的繪圖緩衝區（實體畫素）縮小
    canvas.width = displayWidth * targetPixelRatio;
    canvas.height = displayHeight * targetPixelRatio;
    
    // 但透過 CSS 讓它依然填滿整個螢幕
    canvas.style.width = displayWidth + "px";
    canvas.style.height = displayHeight + "px";
}

// 原本的 config 設定依然保留（雙重保險）
config.devicePixelRatio = targetPixelRatio;

if (isMobileDevice) {
  // Mobile device style: fill the whole browser client area with the game canvas:
  var meta = document.createElement('meta');
  meta.name = 'viewport';
  meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
  document.getElementsByTagName('head')[0].appendChild(meta);
  
  // =======================================================================
  // 【手機端核心修正】強制讓加載框在手機上也是全螢幕絕對定位，防止被網頁網址列推擠偏位
  container.className = "unity-mobile";
  loadingBar.style.position = "fixed";
  // =======================================================================
}

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          // =======================================================================
          // �i�N�쥻�� loadingBar.style.display = "none"; �קאּ�H�U�o��j
          // ���J������A�������� Loading �e���q�������u�ޱ��P���v�A�O�ҵ�������B�����d�e���I
          loadingBar.remove(); 
          // =======================================================================
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
